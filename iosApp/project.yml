name: WalkingChallenge
options:
  bundleIdPrefix: com.walkingchallenge
  deploymentTarget:
    iOS: 16.0
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_PREVIEWS: YES

attributes:
  ORGANIZATIONNAME: Walking Challenge

targets:
  WalkingChallenge:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    resources:
      - path: Resources
        type: folder
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkingchallenge.app
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_ENTITLEMENTS: Config/WalkingChallenge.entitlements
        DEVELOPMENT_TEAM: 5WQNZ7HVT9
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Config/WalkingChallenge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.associated-domains:
          - applinks:app.walkingchallenge.com
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: YouWillNeverWalkAlone
        CFBundleDisplayName: YouWillNeverWalkAlone
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: walkingchallenge
            CFBundleURLSchemes: ["walkingchallenge"]
        LSApplicationQueriesSchemes: ["shealth"]
        NSCameraUsageDescription: "Camera access is required to personalize your profile."
        NSHealthShareUsageDescription: "We use your step count to power the Walking Challenge leaderboards."
        NSHealthUpdateUsageDescription: "We update your step goals and achievements in Walking Challenge."
        NSCalendarsUsageDescription: "Calendar access lets us add challenge reminders."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
schemes:
  WalkingChallenge:
    build:
      targets:
        WalkingChallenge: all
    run:
      config: Debug
    archive:
      config: Release
